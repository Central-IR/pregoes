<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregões - I.R. Comércio</title>
    <link rel="icon" type="image/png" href="I.R.-COMERCIO-E-MATERIAIS-ELETRICOS-PRETO.png">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
    <!-- Splash Screen -->
    <div class="splash-screen" id="splashScreen">
        <div class="loader"></div>
    </div>

    <div class="app-content">
        <div class="container">
            <!-- HEADER -->
            <div class="header">
                <div class="header-left">
                    <h1>Pregões</h1>
                    <div id="connectionStatus" class="connection-status offline">
                        <span class="status-dot"></span>
                    </div>
                </div>
                <button onclick="openFormModal()" class="btn-new-order-header">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Novo Pregão
                </button>
            </div>

            <!-- DASHBOARD CARDS -->
            <div class="dashboard-grid">
                <div class="stat-card">
                    <div class="stat-icon stat-icon-default">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value stat-value-info" id="totalPregoes">0</div>
                        <div class="stat-label">Total de Pregões</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon stat-icon-warning">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value stat-value-warning" id="totalAbertos">0</div>
                        <div class="stat-label">Abertos</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon stat-icon-success">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value stat-value-success" id="totalGanhos">0</div>
                        <div class="stat-label">Ganhos</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon stat-icon-danger">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <div class="stat-value stat-value-danger" id="totalOcorridos">0</div>
                        <div class="stat-label">Ocorridos</div>
                    </div>
                </div>
            </div>

            <!-- SEARCH BAR COM FILTRO DE MÊS -->
            <div class="search-bar-wrapper">
                <div class="search-bar">
                    <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                    <input type="text" id="search" placeholder="Pesquisar" oninput="filterPregoes()">

                    <div class="search-bar-filters">
                        <div class="filter-dropdown-inline">
                            <select id="filterResponsavel" onchange="filterPregoes()">
                                <option value="">Responsável</option>
                                <option value="ROBERTO">ROBERTO</option>
                                <option value="ISAQUE">ISAQUE</option>
                                <option value="MIGUEL">MIGUEL</option>
                            </select>
                            <svg class="dropdown-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                        <div class="filter-dropdown-inline">
                            <select id="filterStatus" onchange="filterPregoes()">
                                <option value="">Todos os Status</option>
                                <option value="ABERTO">ABERTO</option>
                                <option value="GANHO">GANHO</option>
                                <option value="OCORRIDO">OCORRIDO</option>
                            </select>
                            <svg class="dropdown-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                        <!-- Navegação de Mês (como Ordem de Compra) -->
                        <div class="month-navigation-inline">
                            <button onclick="changeMonth(-1)" class="month-nav-arrow" title="Mês anterior">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="15 18 9 12 15 6"></polyline>
                                </svg>
                            </button>
                            <div class="month-display-inline">
                                <span id="currentMonth">Carregando...</span>
                            </div>
                            <button onclick="changeMonth(1)" class="month-nav-arrow" title="Próximo mês">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="9 18 15 12 9 6"></polyline>
                                </svg>
                            </button>
                        </div>
                        <button class="calendar-btn" onclick="toggleCalendar()" title="Selecionar mês">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                        </button>
                        <button class="calendar-btn" onclick="resetToAllMonths()" title="Todos os meses">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="4" width="20" height="18" rx="2" ry="2"></rect>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="2" y1="10" x2="22" y2="10"></line>
                            </svg>
                        </button>
                    </div>

                    <button class="calendar-btn" onclick="syncData()" title="Sincronizar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- CALENDAR MODAL (igual ao Ordem de Compra) -->
            <div class="calendar-modal" id="calendarModal">
                <div class="calendar-content">
                    <div class="calendar-header">
                        <button onclick="changeCalendarYear(-1)" class="calendar-year-nav">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="15 18 9 12 15 6"></polyline>
                            </svg>
                        </button>
                        <h3 id="calendarYear">2026</h3>
                        <button onclick="changeCalendarYear(1)" class="calendar-year-nav">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="9 18 15 12 9 6"></polyline>
                            </svg>
                        </button>
                    </div>
                    <div class="calendar-months" id="calendarMonths"></div>
                </div>
            </div>

            <!-- TABELA PRINCIPAL -->
            <div class="card table-card">
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 40px; text-align: center;">✓</th>
                                <th>Responsável</th>
                                <th>Data</th>
                                <th>Hora</th>
                                <th>Nº Pregão</th>
                                <th>UASG</th>
                                <th>Status</th>
                                <th style="text-align: center;">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="pregoesContainer"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL NOVO PREGÃO (mantido) -->
    <div class="modal-overlay" id="formModal">
        <!-- ... conteúdo existente (não modificado) ... -->
    </div>

    <!-- MODAL VISUALIZAR (mantido) -->
    <div class="modal-overlay" id="infoModal">
        <!-- ... conteúdo existente (não modificado) ... -->
    </div>

    <!-- MODAL EXCLUIR (mantido) -->
    <div class="modal-overlay" id="deleteModal">
        <!-- ... conteúdo existente (não modificado) ... -->
    </div>

    <!-- MODAL ASSINATURA EXEQUIBILIDADE (mantido) -->
    <div class="modal-overlay" id="modalAssinaturaExe">
        <!-- ... conteúdo existente (não modificado) ... -->
    </div>

    <!-- MODAL ASSINATURA PROPOSTA (mantido) -->
    <div class="modal-overlay" id="modalAssinatura">
        <!-- ... conteúdo existente (não modificado) ... -->
    </div>

    <!-- MODAL CONFIGURAÇÃO DA PROPOSTA (novo) -->
    <div class="modal-overlay" id="modalConfigProposta">
        <div class="modal-content" style="max-width: 600px;">
            <div class="modal-header">
                <h3 class="modal-title">Configurações da Proposta</h3>
                <button class="close-modal" onclick="fecharModalConfigProposta()">✕</button>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Imposto Federal (%)</label>
                    <input type="number" id="configImpostoFederal" step="0.1" value="9.7">
                </div>
                <div class="form-group">
                    <label>Frete Venda (%)</label>
                    <input type="number" id="configFreteVenda" step="0.1" value="5">
                </div>
                <div class="form-group">
                    <label>Frete Compra (R$)</label>
                    <input type="number" id="configFreteCompra" step="0.01" value="0">
                </div>
                <div class="form-group">
                    <label>Validade da Proposta (texto)</label>
                    <input type="text" id="configValidade" placeholder="Ex: 60 DIAS">
                </div>
                <div class="form-group">
                    <label>Prazo de Entrega (texto)</label>
                    <input type="text" id="configPrazoEntrega" placeholder="Ex: IMEDIATO">
                </div>
                <div class="form-group">
                    <label>Prazo de Pagamento (texto)</label>
                    <input type="text" id="configPrazoPagamento" placeholder="Ex: 30 DIAS">
                </div>
                <div class="form-group">
                    <label>Dados Bancários</label>
                    <textarea id="configDadosBancarios" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Incluir assinatura?</label>
                    <select id="configAssinatura">
                        <option value="true">Sim</option>
                        <option value="false">Não</option>
                    </select>
                </div>
            </div>
            <div class="modal-actions">
                <button class="success" onclick="salvarConfigProposta()">Salvar</button>
                <button class="danger" onclick="fecharModalConfigProposta()">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL COTAÇÃO (substitui o envio direto) -->
    <div class="modal-overlay" id="modalCotacao">
        <div class="modal-content" style="max-width: 500px;">
            <div class="modal-header">
                <h3 class="modal-title">Cotação</h3>
                <button class="close-modal" onclick="fecharModalCotacao()">✕</button>
            </div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Fornecedor (marca)</label>
                    <select id="cotacaoFornecedor" onchange="gerarMensagemCotacao()">
                        <option value="">Selecione...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tipo</label>
                    <select id="cotacaoTipo" onchange="gerarMensagemCotacao()">
                        <option value="descricao">Por Descrição</option>
                        <option value="modelo">Por Modelo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Mensagem</label>
                    <textarea id="cotacaoMensagem" rows="10" readonly style="background: var(--input-bg); font-family: monospace;"></textarea>
                </div>
            </div>
            <div class="modal-actions">
                <button class="success" onclick="copiarMensagemCotacao()">Copiar</button>
                <button class="danger" onclick="fecharModalCotacao()">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        setTimeout(() => {
            const splash = document.getElementById('splashScreen');
            if (splash) splash.style.display = 'none';
        }, 3000);
    </script>
    <script src="script.js"></script>
    <script src="calendar.js"></script>
</body>
</html>
